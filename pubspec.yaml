name: farmio_mobile
description: Farmio farmer mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.0

  # Routing
  go_router: ^13.2.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # Shimmer loading
  shimmer: ^3.0.0

  # Field boundary / farm map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Document evidence upload
  image_picker: ^1.1.2

  # File picking for data import/export
  # 8.x hardcodes compileSdk 34 in its own Android module, which no longer
  # satisfies flutter_plugin_android_lifecycle's compileSdk-36 requirement —
  # 10.3.3+ reads flutter.compileSdkVersion dynamically instead.
  file_picker: ^10.3.3

  # PDF report export
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  pdf: ^3.11.1

  # Local on-device database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  uuid: ^4.4.0

  # PIN hashing
  crypto: ^3.0.3

  # Opening Terms/Privacy links in an external browser
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true