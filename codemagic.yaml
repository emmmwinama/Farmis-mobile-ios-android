workflows:
  ios-sideload:
    name: iOS unsigned build (AltStore sideload)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Pulls in API_BASE_URL_OVERRIDE (and anything else added to this
      # group later) from Codemagic's Environment variables page — a
      # variable being set there isn't enough on its own, the workflow has
      # to explicitly ask for its group.
      groups:
        - main
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Run tests
        script: flutter test
      - name: Build unsigned iOS app
        script: |
          # API_BASE_URL_OVERRIDE lets a build point at a dev/tunnel backend
          # instead of the compiled-in production default (api_config.dart) —
          # set it as a Codemagic environment variable only when you need a
          # one-off test build; leave unset for a normal build.
          if [ -n "$API_BASE_URL_OVERRIDE" ]; then
            echo "Building against API_BASE_URL override: $API_BASE_URL_OVERRIDE"
            flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL_OVERRIDE
          else
            flutter build ios --release --no-codesign
          fi
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r farmis-mobile.ipa Payload
    artifacts:
      - farmis-mobile.ipa
